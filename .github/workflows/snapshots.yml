name: Update screenshots

# Run by hand after an intentional design change: regenerates the Linux reference
# screenshots the visual tests compare against and commits them to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual.spec.js --update-snapshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          git diff --cached --quiet && { echo "Screenshots unchanged."; exit 0; }
          git commit -m "Update reference screenshots."
          git push
